name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla che il tag corrisponda alla versione
        run: |
          VERSION="$(sed -n 's/^version=//p' metadata.txt | tr -d '\r')"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Il tag ${GITHUB_REF_NAME} non corrisponde a version=${VERSION} in metadata.txt" >&2
            exit 1
          fi

      - name: Crea lo ZIP
        run: scripts/build_zip.sh "${GITHUB_REF_NAME}" dist

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
          fi
